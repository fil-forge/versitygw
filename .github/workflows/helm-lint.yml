name: Lint Helm Chart

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint chart (root account)
        run: helm lint chart/ --strict --set auth.accessKey=dummy --set auth.secretKey=dummy

      - name: Lint chart (no root account, IAM backend)
        run: helm lint chart/ --strict --set iam.enabled=true
