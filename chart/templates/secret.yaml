{{- if and (include "versitygw.rootCredentialsEnabled" .) (not .Values.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "versitygw.credentialsSecretName" . }}
  labels:
    {{- include "versitygw.labels" . | nindent 4 }}
type: Opaque
stringData:
  rootAccessKeyId: {{ required "auth.accessKey and auth.secretKey must be set together" .Values.auth.accessKey | quote }}
  rootSecretAccessKey: {{ required "auth.accessKey and auth.secretKey must be set together" .Values.auth.secretKey | quote }}
{{- end }}
